name: Deploy gateway

# Manual redeploy (releases deploy automatically, see release.yml). Needs the repository secret
#   CLOUDFLARE_API_TOKEN   (Workers Scripts:Edit, D1:Edit, R2:Edit on the account in wrangler.toml)
# The account id and D1 database id are committed in gateway/wrangler.toml. Worker secrets
# (ADMIN_TOKEN, RATE_LIMIT_SALT, optional UPLOAD_TOKEN) are set once with `wrangler secret put`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: gateway
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
