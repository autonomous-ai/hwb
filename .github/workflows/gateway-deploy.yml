name: Deploy gateway

# Manual: Actions -> Deploy gateway -> Run workflow. Needs repository secrets
#   CLOUDFLARE_API_TOKEN   (Workers Scripts:Edit, D1:Edit, R2:Edit for the account)
#   CLOUDFLARE_ACCOUNT_ID
#   HWB_D1_DATABASE_ID     (from `wrangler d1 create hwb-reports`)
# UPLOAD_TOKEN / ADMIN_TOKEN are Worker secrets set once with `wrangler secret put`.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: gateway
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - name: Point wrangler.toml at the real D1 database
        env:
          DB_ID: ${{ secrets.HWB_D1_DATABASE_ID }}
        run: |
          test -n "$DB_ID" || { echo "::error::HWB_D1_DATABASE_ID secret is not set"; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$DB_ID\"/" wrangler.toml
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
