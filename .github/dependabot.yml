version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
    groups:
      report-ui:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /gateway
    schedule:
      interval: monthly
    groups:
      gateway:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-tools:
        patterns: ["*"]
