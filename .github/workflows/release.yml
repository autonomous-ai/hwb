name: Release

# Cut a release:  bump version in pyproject.toml + src/hwb/__init__.py, merge, then
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: release # optional: add required reviewers in repo settings
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(make -s version)"
          init="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/hwb/__init__.py)"
          echo "tag=$tag pyproject=$pkg __init__=$init"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$init" ] || { echo "::error::tag/version mismatch"; exit 1; }

      - uses: astral-sh/setup-uv@v6

      - name: Build
        run: make dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/hwb.pyz
            dist/install.sh
            dist/*.whl
            dist/*.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease";; esac   # v1.0.0-rc1 etc.
          gh release create "$TAG" dist/hwb.pyz dist/install.sh dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "hwb $TAG" $prerelease

  # The gateway embeds the report viewer, so every release redeploys it (code, viewer, D1
  # migrations). Needs the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts, D1, R2
  # edit on the account in gateway/wrangler.toml); without it this job only leaves a notice.
  gateway:
    name: deploy gateway
    needs: release
    runs-on: ubuntu-latest
    environment: gateway
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Deploy
        working-directory: gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; gateway not deployed (run: cd gateway && npm run deploy)"
            exit 0
          fi
          npm ci
          npm run deploy
