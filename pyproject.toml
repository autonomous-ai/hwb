[project]
name = "hwb"
version = "0.6.0"
description = "Acceptance-test toolkit for fresh NVIDIA GPU servers: driver checks, inventory, benchmarks, vLLM smoke test"
readme = "README.md"
requires-python = ">=3.10"
# The core MUST stay stdlib-only so it runs on a bare server and bundles into a single .pyz.
# Heavy deps (torch, vllm) live in isolated uv-managed venvs created on demand.
dependencies = []

[project.scripts]
hwb = "hwb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hwb"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF", "BLE", "PTH"]
ignore = [
  "E501", # line length is enforced by `ruff format`; long string literals are fine
  "S603", # subprocess without shell: all calls go through hwb.core.proc with argv lists
  "S607", # partial executable path: resolved via shutil.which in hwb.core.proc
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
